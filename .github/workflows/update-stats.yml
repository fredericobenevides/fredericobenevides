name: Update README stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Verify STATS_TOKEN
        env:
          PAT: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::STATS_TOKEN secret is not configured"
            exit 1
          fi
          if ! curl -sSf -o /dev/null \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user; then
            echo "::error::STATS_TOKEN is invalid or expired"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=fredericobenevides&show_icons=true&theme=dracula
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=fredericobenevides&layout=compact&langs_count=7&theme=dracula
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg || true
          git diff --staged --quiet || git commit -m "chore: update README stats cards"
          git pull --rebase
          git push
