name: Generate contribution snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify STATS_TOKEN
        env:
          PAT: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::STATS_TOKEN secret is not configured"
            exit 1
          fi
          if ! curl -sSf -o /dev/null \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user; then
            echo "::error::STATS_TOKEN is invalid or expired"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            profile/snake.svg?color_snake=#bd93f9&color_dots=#ebebeb,#c4c4c4,#8be9fd,#ff79c6,#50fa7b
            profile/snake-dark.svg?color_snake=#bd93f9&color_dots=#282a36,#44475a,#8be9fd,#ff79c6,#50fa7b

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/snake*.svg || true
          git diff --staged --quiet || git commit -m "chore: update contribution snake"
          git pull --rebase
          git push
